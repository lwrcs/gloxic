# Gloxic game server: a Cloudflare Worker plus three Durable Object classes.
#   Lobby - one per friend code: the party, mode choice, starting matches
#   Match - one per match: the authoritative 64 Hz simulation
#   Probe - one per region: answers pings so browsers can measure latency
#
# Local:  npm run server:dev        (uses server/.dev.vars, dev sign-in)
# Deploy: npm run server:deploy     (set secrets first, see README)

name = "gloxic-server"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Pages that may talk to the server (comma separated). Production only:
# local development adds localhost in server/.dev.vars.
ALLOWED_ORIGINS = "https://lwrcs.com,https://www.lwrcs.com"
# Firebase project whose ID tokens are accepted (Project settings > General).
FIREBASE_PROJECT_ID = "gloxic-dcc9b"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[durable_objects.bindings]]
name = "PROBE"
class_name = "Probe"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Match", "Probe"]

# Per-account limit on creating / joining lobbies.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-IP limit on creating / joining lobbies (guest accounts are free, so
# this is what stops guessing friend codes with many accounts).
[[ratelimits]]
name = "LOBBY_IP_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Per-IP limit on everything else that reaches a Durable Object (probes,
# sockets). Generous: a ping measurement is ~36 requests, and friends on
# one network share an address.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }
